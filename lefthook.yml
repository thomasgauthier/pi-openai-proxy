output:
  - failure
  - summary

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: false
  commands:
    format:
      stage_fixed: true
      run: |
        output="$(pnpm exec biome check --write {staged_files} 2>&1)"
        status=$?
        printf "%s\n" "$output"
        if [ $status -ne 0 ] && printf "%s" "$output" | grep -q "No files were processed"; then
          exit 0
        fi
        exit $status
    lint:
      run: pnpm run lint
    lint-types:
      run: pnpm run typecheck

pre-push:
  parallel: false
  commands:
    lockfile-sync:
      priority: 0
      run: |
        pnpm install --lockfile-only
        if ! git diff --quiet -- pnpm-lock.yaml; then
          echo ""
          echo "Lockfile is out of sync. Commit the updated lockfile before pushing:"
          echo ""
          git diff --stat -- pnpm-lock.yaml
          echo ""
          echo "  git add pnpm-lock.yaml && git commit -m 'chore: sync lockfile'"
          echo ""
          exit 1
        fi
    lint-types:
      priority: 1
      run: pnpm run typecheck
    lint:
      priority: 2
      run: pnpm run lint
    test:
      priority: 3
      run: pnpm run test:ci
